<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>瓷砖墙生成器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23191b16'/%3E%3Crect x='3' y='3' width='18' height='18' fill='%23ffb77c'/%3E%3C/svg%3E" />
</head>
<body>
  <main class="app">
    <aside class="panel">
      <header class="app-title">
        <h1>瓷砖墙生成器</h1>
      </header>

      <!-- 窄屏功能 Tab -->
      <md-tabs id="mobileTabs" active-tab-index="0">
        <md-primary-tab aria-label="种子颜色">
          <svg slot="icon" viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-85 32-158t87.5-127q55.5-54 130-84.5T489-880q79 0 150 26.5T763.5-780q53.5 47 85 111.5T880-527q0 108-63 170.5T650-294h-75q-18 0-31 14t-13 31q0 27 14.5 46t14.5 44q0 38-21 58.5T480-80Zm0-400Zm-198 11q15-15 15-35t-15-35q-15-15-35-15t-35 15q-15 15-15 35t15 35q15 15 35 15t35-15Zm126-170q15-15 15-35t-15-35q-15-15-35-15t-35 15q-15 15-15 35t15 35q15 15 35 15t35-15Zm214 0q15-15 15-35t-15-35q-15-15-35-15t-35 15q-15 15-15 35t15 35q15 15 35 15t35-15Zm131 170q15-15 15-35t-15-35q-15-15-35-15t-35 15q-15 15-15 35t15 35q15 15 35 15t35-15ZM480-140q11 0 15.5-4.5T500-159q0-14-14.5-26T471-238q0-46 30-81t76-35h73q76 0 123-44.5T820-527q0-132-100-212.5T489-820q-146 0-247.5 98.5T140-480q0 141 99.5 240.5T480-140Z"/></svg>
        </md-primary-tab>
        <md-primary-tab aria-label="墙身尺寸">
          <svg slot="icon" viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M140-240q-24 0-42-18t-18-42v-360q0-23 18-41.5t42-18.5h680q24 0 42 18.5t18 41.5v360q0 24-18 42t-42 18H140Zm0-60h680v-360H690v180h-60v-180H510v180h-60v-180H330v180h-60v-180H140v360Zm130-180h60-60Zm180 0h60-60Zm180 0h60-60Zm-150 0Z"/></svg>
        </md-primary-tab>
        <md-primary-tab aria-label="色差幅度">
          <svg slot="icon" viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M427-120v-225h60v83h353v60H487v82h-60Zm-307-82v-60h247v60H120Zm187-166v-82H120v-60h187v-84h60v226h-60Zm120-82v-60h413v60H427Zm166-165v-225h60v82h187v60H653v83h-60Zm-473-83v-60h413v60H120Z"/></svg>
        </md-primary-tab>
        <md-primary-tab aria-label="样式">
          <svg slot="icon" viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M120-260v-440q0-24.75 17.63-42.38Q155.25-760 180-760h600q24.75 0 42.38 17.62Q840-724.75 840-700v440q0 24.75-17.62 42.37Q804.75-200 780-200H180q-24.75 0-42.37-17.63Q120-235.25 120-260Zm270-250h390v-190H390v190Zm229 250h161v-190H619v190Zm-229 0h162v-190H390v190Zm-210 0h150v-440H180v440Z"/></svg>
        </md-primary-tab>
        <md-primary-tab aria-label="导出">
          <svg slot="icon" viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M480-313 287-506l43-43 120 120v-371h60v371l120-120 43 43-193 193ZM220-160q-24 0-42-18t-18-42v-143h60v143h520v-143h60v143q0 24-18 42t-42 18H220Z"/></svg>
        </md-primary-tab>
      </md-tabs>

      <div class="tabpanels">

      <!-- 种子颜色 -->
      <section class="group tabpanel active" data-tab="0" id="tabpanel-0">
        <h2>种子颜色</h2>
        <div class="seedrow">
          <button class="swatch" id="btnSwatch" title="选择颜色" aria-label="选择颜色">
            <span id="swatchFill"></span>
          </button>
          <md-outlined-text-field id="seedHex" label="HEX" value="#2E6F8E"></md-outlined-text-field>
          <md-icon-button id="btnRandom" aria-label="随机取色">
            <!-- dice / casino icon -->
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5z"/>
            </svg>
          </md-icon-button>
          <input type="color" id="seedColor" value="#2e6f8e" hidden />
        </div>

        <!-- 砖缝颜色（与种子颜色同款样式） -->
        <div class="seedrow">
          <button class="swatch" id="btnGroutPick" title="选择砖缝颜色" aria-label="选择砖缝颜色">
            <span id="groutFill"></span>
          </button>
          <md-outlined-text-field id="groutHex" label="砖缝HEX" value="#0B0D11"></md-outlined-text-field>
          <md-filter-chip id="chipGroutTransparent">透明</md-filter-chip>
          <input type="color" id="groutColor" value="#0b0d11" hidden />
        </div>
      </section>

      <!-- 墙身尺寸 -->
      <section class="group tabpanel" data-tab="1" id="tabpanel-1">
        <h2>墙身尺寸</h2>
        <div class="slidergrid">
          <div class="sf-row">
            <span class="lbl">列数</span><output id="vCols">30</output>
          </div>
          <md-slider id="cols" min="8" max="60" step="1" value="30"></md-slider>
          <div class="sf-row">
            <span class="lbl">行数</span><output id="vRows">20</output>
          </div>
          <md-slider id="rows" min="8" max="40" step="1" value="20"></md-slider>
          <div class="sf-row">
            <span class="lbl">瓷砖边长</span><output id="vTile">34</output>
          </div>
          <md-slider id="tile" min="16" max="70" step="1" value="34"></md-slider>
          <div class="sf-row">
            <span class="lbl">砖缝宽度</span><output id="vGrout">5</output>
          </div>
          <md-slider id="grout" min="1" max="16" step="1" value="5"></md-slider>
        </div>
      </section>

      <!-- 色差幅度 -->
      <section class="group tabpanel" data-tab="2" id="tabpanel-2">
        <h2>色差幅度（越大越跳色）</h2>
        <div class="slidergrid">
          <div class="sf-row">
            <span class="lbl">色相偏移</span><output id="vHue">±0°</output>
          </div>
          <md-slider id="hueR" min="0" max="60" step="1" value="6"></md-slider>
          <div class="sf-row">
            <span class="lbl">饱和度偏移</span><output id="vSat">±0%</output>
          </div>
          <md-slider id="satR" min="0" max="60" step="1" value="14"></md-slider>
          <div class="sf-row">
            <span class="lbl">明度偏移</span><output id="vLiq">±0%</output>
          </div>
          <md-slider id="liqR" min="0" max="80" step="1" value="16"></md-slider>
        </div>
      </section>

      <!-- 样式 -->
      <section class="group tabpanel" data-tab="3" id="tabpanel-3">
        <h2>样式</h2>
        <div class="lbl">砌法</div>
        <div class="chips">
          <md-filter-chip id="chipNoise" selected>港铁风格</md-filter-chip>
          <md-filter-chip id="chipGrid">工字形</md-filter-chip>
        </div>
        <div class="slidergrid" id="motifWrap">
          <div class="sf-row">
            <span class="lbl">整体色块纹样强度</span><output id="vMotif">9</output>
          </div>
          <md-slider id="motifAmp" min="0" max="30" step="1" value="9"></md-slider>
        </div>
      </section>

      <!-- 操作（导出） -->
      <section class="group tabpanel" data-tab="4" id="tabpanel-4">
        <div class="btns">
          <md-filled-button id="download">
            <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            导出 SVG
          </md-filled-button>
          <md-outlined-button id="downloadPng">
            <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
            </svg>
            导出 PNG
          </md-outlined-button>
          <md-outlined-button id="regenerate">
            <svg slot="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74C4.46 9.97 4 11.43 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4z"/>
            </svg>
            换个砌法（重新随机）
          </md-outlined-button>
        </div>
        <div class="meta" id="meta">&nbsp;</div>
      </section>
      </div><!-- /.tabpanels -->
    </aside>

    <section class="stage" id="stage">
      <canvas id="tileCanvas"></canvas>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
